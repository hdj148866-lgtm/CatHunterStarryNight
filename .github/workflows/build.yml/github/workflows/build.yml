name: Build Cat Hunter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CatHunterStarryNight-Android-Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          ZIP_FILE="CatHunterStarryNight-Android-Project.zip"
          test -f "$ZIP_FILE" || { echo "Project ZIP not found: $ZIP_FILE"; ls -la; exit 1; }
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Project files:"
          find extracted -maxdepth 3 -type f | head -80

      - name: Download Three.js
        run: |
          mkdir -p extracted/app/src/main/assets
          curl -L --fail --retry 3 https://unpkg.com/three@0.170.0/build/three.module.js -o extracted/app/src/main/assets/three.module.js
          test -s extracted/app/src/main/assets/three.module.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatHunter-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
